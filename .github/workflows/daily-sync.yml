name: Daily Market Data Sync

on:
  schedule:
    # Runs at 16:00 UTC = 9:30 PM IST (after market close ~3:30 PM IST)
    # Cron format: minute hour day month day-of-week
    - cron: '0 16 * * 1-5'  # Mon-Fri only
  workflow_dispatch: {}  # allows manual trigger from GitHub UI too

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend sync-all endpoint
        run: |
          echo "Triggering data sync..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://tradepulse-backend-l79z.onrender.com/api/analysis/sync-all)
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" -ne 200 ]; then
            echo "Sync failed with status $status"
            exit 1
          fi
          echo "Sync completed successfully."
